<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>黄雀在后·迷城寻踪</title>
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600;900&display=swap">
<style>
:root{
  --paper:#EFE6D0; --paper2:#E6D9B8; --ink:#2A241B; --soft:#6A5F48; --seal:#A63325; --seal2:#C8412F;
  --gold:#D9AE55; --gold2:#F1D38A; --line:#C9BB98; --card:#F6EFDE; --lac:rgba(24,17,11,.78);
  --brush:"Ma Shan Zheng","STXingkai","KaiTi","STKaiti","Noto Serif SC",serif;
  --serif:"Noto Serif SC","Songti SC","STSong",SimSun,serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#140e08;color:var(--ink);font-family:var(--serif);user-select:none;-webkit-user-select:none}
#c3d{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.brush{font-family:var(--brush);font-weight:400}
b.s,.seal-t{color:var(--seal)} .muted{color:var(--soft)} .center{text-align:center} .gold{color:var(--gold)}
kbd{background:var(--ink);color:var(--paper);padding:1px 7px;font-family:inherit;font-size:12px;margin:0 2px;border-radius:3px}

#vignette{position:fixed;inset:0;pointer-events:none;z-index:2;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 55%,rgba(10,5,0,.55) 100%);transition:background .6s}
#vignette.tense{background:radial-gradient(ellipse at center,rgba(0,0,0,0) 45%,rgba(60,0,0,.55) 100%)}
#vignette.chase{background:radial-gradient(ellipse at center,rgba(0,0,0,0) 40%,rgba(90,20,0,.6) 100%)}
#fade{position:fixed;inset:0;background:#0d0906;z-index:40;pointer-events:none;opacity:1;transition:opacity .7s}

/* 载入 */
#loading{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#140e08;color:var(--paper);transition:opacity .8s}
#loading h1{font-family:var(--brush);font-weight:400;font-size:64px;margin:0;letter-spacing:.1em}
#loading h1 span{color:var(--seal2)}
#loading .bar{width:240px;height:3px;background:rgba(239,230,208,.15);margin-top:22px}
#loading .bar i{display:block;height:100%;width:0;background:var(--gold);transition:width .2s}
#loading p{opacity:.6;font-size:13px;letter-spacing:.3em;margin-top:12px}

/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;z-index:5;display:none}
.panel{background:var(--lac);color:var(--paper);border:1px solid rgba(217,174,85,.35);box-shadow:0 4px 18px rgba(0,0,0,.35);backdrop-filter:blur(3px)}
#hud-tl{position:absolute;top:12px;left:12px;padding:9px 14px 10px;max-width:min(360px,58vw);border-left:3px solid var(--seal2)}
#chap{font-family:var(--brush);font-size:22px;color:var(--gold2);letter-spacing:.06em;line-height:1.1}
#obj{font-size:13.5px;opacity:.92;margin-top:4px;line-height:1.5}
#timer{height:4px;background:rgba(255,255,255,.12);margin-top:7px;display:none}
#timer i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--seal2),var(--gold))}
#hud-tr{position:absolute;top:12px;right:12px;display:flex;flex-direction:column;align-items:flex-end;gap:6px;pointer-events:auto}
.hrow{display:flex;gap:6px;align-items:center}
.chip{padding:5px 11px;font-size:14px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.chip b{color:var(--gold2);font-size:16px}
.hbtn{pointer-events:auto;cursor:pointer;font-family:inherit;font-size:13px;padding:5px 11px;color:var(--paper)}
.hbtn:hover{border-color:var(--gold)}
#bird{position:relative;width:118px}
#bird .lbl{font-size:11px;letter-spacing:.2em;opacity:.8}
#bird .track{height:5px;background:rgba(255,255,255,.12);margin-top:3px}
#bird .track i{display:block;height:100%;width:0;background:linear-gradient(90deg,#E8C24A,#F07A2A);transition:width .8s}
#cred{display:none;font-size:18px;letter-spacing:2px}
#compass{position:absolute;top:12px;left:50%;transform:translateX(-50%);padding:6px 16px;display:flex;align-items:center;gap:10px;font-size:14px;white-space:nowrap}
#cmp-arrow{display:inline-block;color:var(--gold2);font-size:18px;transition:transform .08s linear}
#minimap-wrap{position:absolute;right:14px;bottom:14px;width:188px;height:188px;border-radius:50%;overflow:hidden;border:2px solid rgba(217,174,85,.6);box-shadow:0 4px 20px rgba(0,0,0,.5);pointer-events:auto;cursor:pointer;background:#1c150d}
#minimap{width:100%;height:100%;display:block}
#mm-n{position:absolute;right:98px;bottom:192px;color:var(--gold2);font-size:12px;font-family:var(--brush);text-shadow:0 1px 3px #000}
#prompt{position:absolute;left:50%;bottom:22%;transform:translateX(-50%);padding:8px 18px;font-size:15px;display:none;white-space:nowrap}
#prompt kbd{background:var(--gold);color:var(--ink);font-weight:600}
#subs{position:absolute;left:50%;bottom:31%;transform:translateX(-50%);width:min(620px,90vw);text-align:center;pointer-events:none}
#subs .ln{display:inline-block;background:rgba(10,6,3,.72);color:#F7EBD0;padding:5px 14px;margin:3px 0;font-size:15px;border-radius:2px;transition:opacity .4s}
#subs .ln .who{color:var(--gold2)}
#subs .ln.faint{opacity:.55;filter:blur(.4px)}
#stealth{position:absolute;left:50%;bottom:14%;transform:translateX(-50%);display:none;flex-direction:column;align-items:center;gap:5px}
#stealth .mode{font-size:13px;color:var(--paper);letter-spacing:.2em;padding:3px 12px}
#listen{width:200px;height:6px;background:rgba(255,255,255,.14);display:none}
#listen i{display:block;height:100%;width:0;background:#7FD1C4}
#stamina{position:absolute;left:50%;bottom:9%;transform:translateX(-50%);width:160px;height:5px;background:rgba(0,0,0,.4);border-radius:3px;opacity:0;transition:opacity .3s}
#stamina i{display:block;height:100%;width:100%;border-radius:3px;background:linear-gradient(90deg,#8FD16A,#E8D05A)}
#labels{position:fixed;inset:0;pointer-events:none;z-index:4;overflow:hidden}
.wl{position:absolute;transform:translate(-50%,-100%);white-space:nowrap;text-align:center;font-size:13px;color:#FFF3DC;text-shadow:0 1px 3px #000,0 0 8px rgba(0,0,0,.6)}
.wl .nm{font-size:12px;opacity:.9}
.wl .ic{font-size:22px;font-weight:900;font-family:var(--serif);line-height:1}
.wl .ic.q{color:#F2D36B} .wl .ic.x{color:#FF5A3C}
.wl .meter{width:34px;height:4px;background:rgba(0,0,0,.5);margin:2px auto 0}
.wl .meter i{display:block;height:100%;background:#F2B33D}
.wl .bub{background:rgba(246,239,222,.95);color:var(--ink);padding:3px 10px;border-radius:10px;font-size:13px;margin-bottom:4px;max-width:240px;white-space:normal;text-shadow:none}
.wl .key{display:inline-block;background:var(--gold);color:var(--ink);font-weight:700;width:26px;height:26px;line-height:26px;border-radius:50%;font-size:15px;text-shadow:none;box-shadow:0 0 12px rgba(242,211,107,.8)}

#toast{position:fixed;top:17%;left:0;right:0;text-align:center;z-index:30;pointer-events:none;font-size:19px;color:#FFF3DC;text-shadow:0 2px 8px #000;opacity:0;transition:opacity .3s;letter-spacing:.08em}
#banner{position:fixed;left:0;right:0;top:34%;text-align:center;z-index:30;pointer-events:none;opacity:0;transition:opacity .8s}
#banner .k{font-size:13px;letter-spacing:.5em;color:var(--gold2);text-shadow:0 1px 4px #000}
#banner .t{font-family:var(--brush);font-size:clamp(44px,8vw,78px);color:#FFF3DC;text-shadow:0 3px 20px rgba(0,0,0,.8);letter-spacing:.12em}
#banner .line{width:160px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:6px auto}

/* 对话框（视觉小说式） */
#dlg{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);width:min(760px,96vw);z-index:15;display:none;pointer-events:auto}
#dlg .box{display:flex;gap:14px;background:linear-gradient(180deg,rgba(246,239,222,.97),rgba(232,220,192,.97));border:2px solid var(--ink);box-shadow:0 8px 30px rgba(0,0,0,.5);padding:14px 16px 12px;position:relative}
#dlg .por{width:96px;height:96px;flex:none;border:2px solid var(--ink);background:#d8c9a3 center/cover;image-rendering:auto}
#dlg .body{flex:1;min-width:0}
#dlg .nm{font-family:var(--brush);font-size:22px;color:var(--seal);line-height:1.1}
#dlg .nm small{font-family:var(--serif);font-size:12px;color:var(--soft);margin-left:8px}
#dlg .tx{font-size:16px;line-height:1.75;margin-top:4px;min-height:52px}
#dlg .ops{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
#dlg .ops button{font-family:inherit;font-size:14.5px;cursor:pointer;background:var(--ink);color:var(--paper);border:none;padding:7px 14px;letter-spacing:.06em}
#dlg .ops button.alt{background:transparent;color:var(--ink);border:1px solid var(--ink)}
#dlg .ops button:hover{background:var(--seal);color:var(--paper)}
#dlg .ops button:disabled{opacity:.35;pointer-events:none}
#dlg .next{position:absolute;right:14px;bottom:8px;font-size:12px;color:var(--soft);animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.2}}

/* 纸面浮层 */
#ui{position:fixed;inset:0;z-index:20;display:none;overflow-y:auto;background:rgba(18,12,6,.55);backdrop-filter:blur(2px);pointer-events:auto}
.sheet{max-width:640px;margin:5vh auto;background:var(--paper);border:2px solid var(--ink);padding:22px 26px 24px;box-shadow:0 12px 50px rgba(0,0,0,.6);position:relative;
  background-image:radial-gradient(ellipse at 20% 0%,rgba(255,255,255,.35),transparent 60%),radial-gradient(ellipse at 100% 100%,rgba(140,100,40,.12),transparent 50%)}
.sheet.wide{max-width:860px}
.sheet h1{font-family:var(--brush);font-weight:400;font-size:52px;margin:.05em 0;letter-spacing:.05em;line-height:1.2}
.sheet h1 span{color:var(--seal)}
.sheet h2{font-family:var(--brush);font-weight:400;font-size:30px;margin:.1em 0 .3em}
.kicker{letter-spacing:.35em;font-size:12px;color:#9a7a35;margin:0}
.tag{display:inline-block;border:1px solid var(--seal);color:var(--seal);font-size:12px;padding:0 8px;letter-spacing:.15em;margin-bottom:8px}
.sheet p{line-height:1.85;margin:.55em 0}
.letter{background:var(--card);border:1px solid var(--line);padding:14px 18px;font-size:15.5px;margin:10px 0;line-height:1.9;box-shadow:inset 0 0 30px rgba(160,120,50,.12)}
.letter.old{font-family:var(--brush);font-size:22px;line-height:1.7}
.clue{border:1px solid var(--seal);background:var(--card);padding:10px 14px;margin:10px 0;font-size:15px;position:relative}
.clue::before{content:attr(data-k);display:block;color:var(--seal);font-size:12px;letter-spacing:.2em;margin-bottom:3px}
.dq{background:#EDE2C6;border-left:3px solid var(--seal);padding:8px 14px;margin:8px 0;font-size:15px}
.dq .who{color:var(--seal);font-weight:600}
.sheet button,.btn{font-family:inherit;font-size:16px;cursor:pointer;background:var(--ink);color:var(--paper);border:none;padding:10px 24px;margin:8px 8px 0 0;letter-spacing:.12em}
.sheet button:hover,.btn:hover{background:var(--seal)}
.sheet button.alt{background:transparent;color:var(--ink);border:1px solid var(--ink)}
.sheet button.alt:hover{background:var(--ink);color:var(--paper)}
.sheet button:disabled{opacity:.35;pointer-events:none}
.opt{display:flex!important;align-items:center;gap:10px;width:100%;text-align:left;background:var(--card)!important;color:var(--ink)!important;border:1px solid var(--line)!important;margin:7px 0!important;padding:10px 14px!important;font-size:15px!important;letter-spacing:.02em!important}
.opt:hover{border-color:var(--seal)!important;background:#EDE2C6!important}
.opt.sel{border-color:var(--seal)!important;background:#EAD6B8!important;box-shadow:inset 3px 0 0 var(--seal)}
.opt img{width:44px;height:44px;border:1px solid var(--ink);flex:none;background:#d8c9a3}
.keys{font-size:13px;color:var(--soft);border-top:1px dashed var(--line);margin-top:14px;padding-top:10px;line-height:2}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stamp{position:absolute;right:26px;top:20px;border:3px solid var(--seal);color:var(--seal);font-family:var(--brush);font-size:30px;padding:2px 12px;transform:rotate(-10deg);opacity:.85}

/* 迷你游戏 */
.cups{position:relative;height:190px;margin:10px 0 4px;user-select:none}
.cup{position:absolute;bottom:26px;width:96px;height:100px;margin-left:-48px;cursor:pointer;transition:filter .2s}
.cup svg{width:100%;height:100%;filter:drop-shadow(0 6px 6px rgba(0,0,0,.35))}
.cup:hover{filter:brightness(1.08)}
.pearl{position:absolute;bottom:22px;width:26px;height:26px;margin-left:-13px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#f4e8c8 45%,#b8a370);box-shadow:0 2px 6px rgba(0,0,0,.4)}
.table-top{position:absolute;left:0;right:0;bottom:0;height:44px;background:linear-gradient(#7a4a2b,#5a3420);border-top:3px solid #8e5a36;border-radius:4px}
.poem{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;max-width:380px;margin:12px auto}
.poem span{display:block;text-align:center;font-family:var(--brush);font-size:26px;padding:4px 0;border:1px solid transparent;cursor:pointer;background:var(--card)}
.poem span:hover{border-color:var(--line)}
.poem span.on{background:var(--seal);color:var(--paper)}
.poem span.hint{box-shadow:inset 0 0 0 2px rgba(166,51,37,.35)}
.picked{font-family:var(--brush);font-size:34px;letter-spacing:.3em;min-height:48px;color:var(--seal);text-align:center}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.lock{display:flex;justify-content:center;gap:10px;margin:14px 0}
.wheel{display:flex;flex-direction:column;align-items:center;gap:4px}
.wheel button{margin:0!important;padding:2px 16px!important;font-size:14px!important;background:#5a4a35!important}
.wheel .d{width:58px;height:72px;display:flex;align-items:center;justify-content:center;font-size:42px;font-weight:900;color:#3a2a10;
  background:linear-gradient(180deg,#8a6a2a,#e8c86a 30%,#f6e0a0 50%,#e8c86a 70%,#8a6a2a);border:2px solid #3a2a10;border-radius:4px;text-shadow:0 1px 0 rgba(255,255,255,.5)}
.coinrow{font-size:14px;margin-top:6px}

/* 手册 */
#journal{position:fixed;inset:0;z-index:25;display:none;background:rgba(18,12,6,.6);backdrop-filter:blur(2px);pointer-events:auto}
#journal .book{max-width:880px;height:88vh;margin:6vh auto 0;background:var(--paper);border:2px solid var(--ink);display:flex;flex-direction:column;box-shadow:0 12px 50px rgba(0,0,0,.6)}
#journal .jh{display:flex;align-items:center;gap:6px;padding:12px 16px 0;flex-wrap:wrap;border-bottom:1px solid var(--line)}
#journal .jh h2{font-family:var(--brush);font-weight:400;font-size:26px;margin:0 12px 6px 0}
.tab{font-family:inherit;font-size:14px;padding:6px 14px;background:transparent;border:1px solid transparent;border-bottom:none;cursor:pointer;color:var(--soft);margin-bottom:-1px}
.tab.on{background:var(--card);border-color:var(--line);color:var(--ink);font-weight:600}
.tab .n{display:inline-block;min-width:18px;background:var(--seal);color:#fff;border-radius:9px;font-size:11px;padding:0 5px;margin-left:4px}
#journal .jb{flex:1;overflow-y:auto;padding:12px 18px;background:var(--card)}
#journal .jf{padding:8px 16px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--soft)}
.card{border:1px solid var(--line);background:var(--paper);padding:9px 13px;margin:7px 0;font-size:14.5px;line-height:1.7;position:relative}
.card .ct{font-weight:600;color:var(--ink)}
.card .ct .k{font-size:11px;letter-spacing:.15em;padding:0 6px;margin-right:6px;border:1px solid;vertical-align:1px}
.k-clue{color:#8a5a1a} .k-testi{color:#2f5f7a} .k-sight{color:#6a3a8a} .k-over{color:#A63325} .k-intel{color:#2a6a3a} .k-secret{color:#7a5a2a} .k-help{color:#555}
.card.pickable{cursor:pointer}
.card.pickable:hover{border-color:var(--seal);background:#FBF4E4}
.card .per{position:absolute;right:10px;top:8px;font-size:11px;color:var(--soft)}
.dossier{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.dos{border:1px solid var(--line);background:var(--paper);padding:10px;display:flex;gap:10px}
.dos img{width:72px;height:72px;border:1px solid var(--ink);flex:none;background:#d8c9a3}
.dos .nm{font-family:var(--brush);font-size:20px}
.dos .sus{margin-top:4px;display:flex;gap:4px}
.dos .sus button{font-family:inherit;font-size:12px;padding:2px 7px;border:1px solid var(--line);background:var(--card);cursor:pointer}
.dos .sus button.on{background:var(--seal);color:#fff;border-color:var(--seal)}
.timeline{font-size:13.5px;border-collapse:collapse;width:100%;margin-top:6px}
.timeline td,.timeline th{border:1px solid var(--line);padding:5px 7px;vertical-align:top;text-align:left}
.timeline th{background:var(--paper2);font-weight:600}

/* 对质 */
.confront{display:flex;gap:18px;align-items:flex-start}
.confront .who{flex:none;text-align:center;width:150px}
.confront .who img{width:150px;height:150px;border:2px solid var(--ink);background:#d8c9a3}
.stmt{border:1px solid var(--line);background:var(--card);padding:9px 12px;margin:7px 0;cursor:pointer;font-size:15px;position:relative;transition:all .15s}
.stmt:hover{border-color:var(--seal)}
.stmt.sel{border-color:var(--seal);box-shadow:inset 4px 0 0 var(--seal);background:#F3E6CC}
.stmt.broke{text-decoration:line-through;color:var(--soft);cursor:default;border-style:dashed}
.stmt.broke::after{content:"破";position:absolute;right:10px;top:50%;transform:translateY(-50%) rotate(-12deg);font-family:var(--brush);color:var(--seal);font-size:26px;text-decoration:none}
.bigstamp{position:fixed;left:50%;top:42%;z-index:60;font-family:var(--brush);font-size:clamp(70px,14vw,150px);color:var(--seal2);border:8px solid var(--seal2);padding:0 30px;
  transform:translate(-50%,-50%) rotate(-12deg) scale(2.6);opacity:0;pointer-events:none;background:rgba(246,239,222,.9);text-shadow:none;transition:transform .22s cubic-bezier(.2,1.6,.4,1),opacity .15s}
.bigstamp.on{transform:translate(-50%,-50%) rotate(-12deg) scale(1);opacity:1}
.bigstamp.grey{color:#555;border-color:#555}

/* 大地图 */
#bigmap{position:fixed;inset:0;z-index:24;display:none;background:rgba(18,12,6,.72);align-items:center;justify-content:center;pointer-events:auto}
#bigmap canvas{max-width:94vw;max-height:84vh;border:2px solid var(--gold);box-shadow:0 10px 40px #000;background:#1c150d}
#bigmap .cap{position:absolute;bottom:3vh;left:0;right:0;text-align:center;color:var(--paper);font-size:13px;opacity:.8}

/* 触控 */
#touch{display:none}
#stick{position:fixed;left:22px;bottom:26px;width:124px;height:124px;border-radius:50%;border:2px solid rgba(239,230,208,.35);background:rgba(20,14,8,.3);z-index:8;pointer-events:auto;touch-action:none}
#knob{position:absolute;left:40px;top:40px;width:44px;height:44px;border-radius:50%;background:rgba(239,230,208,.55)}
.tbtn{position:fixed;z-index:8;border-radius:50%;border:2px solid rgba(239,230,208,.5);color:#FFF3DC;font-family:inherit;display:flex;align-items:center;justify-content:center;pointer-events:auto;touch-action:none;letter-spacing:.05em}
#t-act{right:24px;bottom:220px;width:74px;height:74px;background:rgba(166,51,37,.8);font-size:15px}
#t-run{right:110px;bottom:190px;width:62px;height:62px;background:rgba(40,70,40,.7);font-size:13px}
#t-crouch{right:34px;bottom:306px;width:54px;height:54px;background:rgba(40,40,60,.7);font-size:12px}
#t-act:disabled{opacity:.35}
.tbtn.on{box-shadow:0 0 0 3px var(--gold)}

@media (max-width:700px){
  #hud-tl{max-width:62vw;padding:7px 10px} #chap{font-size:18px} #obj{font-size:12px}
  #minimap-wrap{width:124px;height:124px;right:10px;bottom:auto;top:128px} #mm-n{display:none}
  #compass{top:auto;bottom:160px;font-size:12px}
  .sheet{margin:2vh 8px;padding:16px 16px 18px} .sheet h1{font-size:40px}
  #dlg .por{width:64px;height:64px} #dlg .tx{font-size:15px}
  .confront{flex-direction:column} .confront .who{width:auto;display:flex;align-items:center;gap:10px} .confront .who img{width:80px;height:80px}
  .grid2{grid-template-columns:1fr}
}
</style>
</head>
<body>
<canvas id="c3d" tabindex="0"></canvas>
<div id="vignette"></div>
<div id="labels"></div>
<div id="hud">
  <div id="hud-tl" class="panel"><div id="chap">序章</div><div id="obj"></div><div id="timer"><i></i></div></div>
  <div id="compass" class="panel"><span id="cmp-arrow">▲</span><span id="cmp-txt"></span></div>
  <div id="hud-tr">
    <div class="hrow">
      <div class="panel chip" title="当前时刻">🕰 <span id="clock">17:00</span></div>
      <div class="panel chip" title="德昌铜钱">🪙 <b id="coins">0</b></div>
      <div class="panel chip" id="cake-chip" title="桂花糕（可送人）" style="display:none">🥮 <b id="cakes">0</b></div>
    </div>
    <div class="panel chip" id="bird" title="黄雀进度：黄雀每完成一次暗中行动就会上涨。满了，配方就外泄了。"><div style="width:100%"><div class="lbl">🐦 黄雀进度 <span id="bird-p">0%</span></div><div class="track"><i id="bird-i"></i></div></div></div>
    <div class="panel chip" id="cred" title="信誉：出示错误证据会扣除"></div>
    <div class="hrow">
      <button class="panel hbtn" onclick="openJournal()">📖 手册 <kbd>J</kbd></button>
      <button class="panel hbtn" id="mute-btn" onclick="toggleMute()">🔊</button>
      <button class="panel hbtn" onclick="openPause()">☰</button>
    </div>
  </div>
  <div id="minimap-wrap" onclick="openMap()"><canvas id="minimap" width="376" height="376"></canvas></div>
  <div id="mm-n">北</div>
  <div id="prompt" class="panel"></div>
  <div id="subs"></div>
  <div id="stealth"><div class="mode panel" id="st-mode">潜行中</div><div id="listen"><i></i></div></div>
  <div id="stamina"><i></i></div>
</div>
<div id="toast"></div>
<div id="banner"><div class="k" id="bn-k"></div><div class="line"></div><div class="t" id="bn-t"></div><div class="line"></div></div>
<div id="dlg"><div class="box"><div class="por" id="dlg-por"></div><div class="body"><div class="nm" id="dlg-nm"></div><div class="tx" id="dlg-tx"></div><div class="ops" id="dlg-ops"></div></div><div class="next" id="dlg-next">点击继续 ▸</div></div></div>
<div id="ui"></div>
<div id="journal"></div>
<div id="bigmap"><canvas id="bigmap-c" width="1000" height="880"></canvas><div class="cap">点击任意处关闭 · <kbd>M</kbd></div></div>
<div id="touch">
  <div id="stick"><div id="knob"></div></div>
  <button class="tbtn" id="t-act" disabled>调查</button>
  <button class="tbtn" id="t-run">疾跑</button>
  <button class="tbtn" id="t-crouch">潜行</button>
</div>
<div class="bigstamp" id="bigstamp">破绽</div>
<div id="fade"></div>
<div id="loading"><h1>黄雀<span>在后</span></h1><div class="bar"><i id="load-i"></i></div><p id="load-t">正在铺青石板……</p></div>
<script>/*__THREE__*/</script>
<script>/*__GAME__*/</script>
</body>
</html>
